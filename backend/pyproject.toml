[project]
name = "market-radar-backend"
version = "0.1.0"
description = "Local public and personal market information collector"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1",
  "feedparser>=6,<7", "praw>=7.8,<8", "cryptography>=44",
  "twikit>=2.3,<3", "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
